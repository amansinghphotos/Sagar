<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sagar: Small Apps for the Mac</title>
<meta name="description" content="Small apps for the Mac. Each needs macOS 27 and keeps itself up to date.">
<style>
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }
  h1 { font-size: 2.5rem; line-height: 1.1; margin: 0 0 0.5rem; }
  h2 { font-size: 1.25rem; margin: 0; }
  p { margin: 0.25rem 0 0; }
  ul { list-style: none; padding: 0; margin: 3rem 0; }
  li { border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); padding: 1.5rem 0; }
  a { display: inline-block; margin-top: 0.75rem; min-height: 44px; line-height: 44px; }
  .quiet { opacity: 0.7; }
</style>
</head>
<body>
<main>
  <h1>Sagar</h1>
  <p>Small apps for the Mac. Each needs macOS 27 and keeps itself up to date.</p>
  <p class="quiet">The first app is on its way.</p>
</main>
</body>
</html>
